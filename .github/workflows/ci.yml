name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
      # A real production build, exercising the config guard with dummy values.
      - run: npm run build
        env:
          VITE_SITE_URL: https://ci.test
          VITE_LEAD_ENDPOINT: https://forms.ci.test/f/ci
          VITE_WHATSAPP_NUMBER: "919000000000"
          VITE_CONTACT_EMAIL: ci@ci.test
